# Example tag database: a simulated bottling line.
#
# This file turns "holding register 4, two words, little word order, no
# scaling" into "motor_current, 12.3 A". It is the single source of truth for
# the address map: drivers, poller, alarms, historian and dashboard all read
# it, and nothing else in the codebase hard-codes an address.
#
# Fields
#   name        unique tag name
#   device      which device the tag lives on; reads are never merged across
#               devices
#   area        holding | input | coil | discrete -- four separate address
#               spaces, never merged with each other
#   address     ZERO-BASED protocol address. Vendor documentation often uses
#               the 4xxxx convention, where holding register 40001 is protocol
#               address 0. Getting this wrong shifts the whole map by one.
#   data_type   bool | int16 | uint16 | int32 | uint32 | float32 | float64
#   word_order  big    = first register is the most significant word (ABCD)
#               little = first register is the least significant word (CDAB)
#   byte_order  big    = normal Modbus byte order inside each register
#               little = bytes swapped inside each register (BADC / DCBA)
#   bit         bit index 0..15 when several booleans share one status word
#   scale/offset  engineering = raw * scale + offset
#   deadband    smallest change worth reporting and archiving, in engineering
#               units. Tie this to the instrument's real accuracy, not to what
#               looks tidy on a trend.
#   poll_group  which rate class this tag belongs to (see devices.yaml)
#   writable    whether a write is even conceivable; the safety allow-list in
#               config/devices.yaml is a second, independent gate
#   alarm       hi_hi / hi / lo / lo_lo limits plus the alarm deadband
#
# Note the deliberately mixed word and byte orders: motor_current is CDAB and
# vibration_rms is BADC, because a real line is a mix of vendors and this file
# is where that mess gets recorded once instead of being rediscovered.
#
# Regenerate this file from the built-in map with:
#   tools/factorylink dump-tags --format yaml
tags:
  - name: conveyor_speed
    device: line1
    area: holding
    address: 0
    data_type: float32
    word_order: big
    byte_order: big
    scale: 1.0
    offset: 0.0
    unit: m/min
    deadband: 0.1
    poll_group: fast
    writable: false
    description: Conveyor line speed
    min_value: 0.0
    max_value: 120.0
    alarm:
      hi_hi: 40.0
      hi: 34.0
      deadband: 1.0
